name: Publish

# Builds every recipe for every ABI in `abis` and publishes the catalog to
# https://get.gleem.gg/obs-plugins/<abi>/. Versions already published are not
# rebuilt (see scripts/publish). A manual run on another branch only builds,
# as a check, and uploads the result as a workflow artifact.
on:
  push:
    branches: [main]
    paths:
      - abis
      - recipes/**
      - scripts/**
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'gleem-gg/obs-plugins'
    runs-on: ubuntu-latest
    env:
      CONTAINER: docker
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign zstd jq >/dev/null

      - name: Build
        if: github.ref != 'refs/heads/main'
        run: |
          while read -r abi; do
            for recipe in recipes/*.json; do
              scripts/build "$abi" "$recipe"
            done
          done < abis

      - name: Publish
        if: github.ref == 'refs/heads/main'
        env:
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          while read -r abi; do
            scripts/publish "$abi"
          done < abis

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
